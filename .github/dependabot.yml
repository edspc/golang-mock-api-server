# The project is stdlib-only on purpose, so gomod has nothing to bump today and
# there are no workflows for github-actions to update yet. Both are configured
# anyway: the moment a dependency or a workflow is added, updates are already
# being watched instead of being remembered about later.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    labels:
      - dependencies
    # Adding a third-party dependency is a deliberate decision here, so keep
    # the queue small enough to actually read.
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 5
